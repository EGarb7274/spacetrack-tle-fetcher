[project]
name = "tle-fetcher"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["spacetrack>=2.0,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
